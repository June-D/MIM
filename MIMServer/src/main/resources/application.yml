spring:
  profiles:
    active: mysql

logging:
  level:
    root: info
    com.junesoon.mim: info

# JWT 配置。rsa-secret 已废弃：签名密钥改为首次启动生成并持久化到 t_rsa_key，
# 不再从配置文件读取，避免私钥随代码仓库泄漏。
jwt:
  token-header: Authorization
  expire: 14400

auth:
  user:
    token-header: Authorization

message:
  # 单条密文字节上限
  max-bytes: 262144
  # 撤回时间窗口（秒）。超过后拒绝撤回，避免无限期篡改历史
  recall-window-seconds: 120

mim:
  # 实例标识，多实例部署时建议显式配置（否则启动时随机生成）。
  # 只用于在 Redis 在线集合里区分不同 Pod，不影响业务语义。
  instance-id: ${HOSTNAME:local}
  redis:
    # 设为 true 时，非本机 Redis 必须同时配置密码与 TLS，否则拒绝启动。
    require-secure: ${MIM_REDIS_REQUIRE_SECURE:false}
  auth:
    # 客户端全部升级后设为 true：拒绝未绑定设备的旧 JWT，强制重新登录。
    require-device-binding: ${MIM_AUTH_REQUIRE_DEVICE_BINDING:false}
  rate-limit:
    # 默认不信任 X-Forwarded-For / X-Real-IP。
    # 只有部署在可信反向代理后面（且代理会覆盖客户端自带的转发头）时才设为 true，
    # 否则客户端只要每次换一个头就能绕过登录/注册的 IP 限流。
    trust-forwarded-headers: ${MIM_TRUST_FORWARDED_HEADERS:false}
  # 邮件服务（仅用于找回密码验证码，不发送其它通知）。
  # host 为空时找回密码接口会提示“邮件服务未配置”。
  mail:
    host: ${MIM_SMTP_HOST:}
    port: ${MIM_SMTP_PORT:465}
    username: ${MIM_SMTP_USERNAME:}
    password: ${MIM_SMTP_PASSWORD:}
    from: ${MIM_MAIL_FROM:}
    ssl: ${MIM_SMTP_SSL:true}
  security:
    # 邮箱加密密钥（Base64，32 字节）。留空时从 JWT 私钥派生。
    # 更换该密钥会导致历史邮箱无法解密，请妥善保管。
    email-key: ${MIM_EMAIL_KEY:}
    # JWT RSA 私钥的静态加密主密钥（Base64，32 字节）。
    # 配置后新写入 t_rsa_key 的密钥为 AES-GCM 密文；丢失/错误会导致拒绝启动。
    master-key: ${MIM_MASTER_KEY:}
  # 传输层安全。默认关闭便于本地开发；生产环境必须开启，
  # 否则 JWT 与登录口令会在网络上明文传输，E2EE 也会被中间人冒充绕过。
  tls:
    enabled: ${MIM_TLS_ENABLED:false}
    keystore: ${MIM_TLS_KEYSTORE:}
    keystore-password: ${MIM_TLS_KEYSTORE_PASSWORD:}
    keystore-type: PKCS12
    key-alias: ${MIM_TLS_KEY_ALIAS:mim}
    client-auth: false
    # 开启 TLS 后默认拒绝明文端口上的业务请求，避免 8080 绕过 TLS。
    # 仅内网调试且明确理解风险时才设为 false。
    block-plaintext: ${MIM_TLS_BLOCK_PLAINTEXT:true}

server:
  # 限制请求头大小，避免超长头占用内存。JSON body 的上限由 RequestSizeLimitFilter 控制。
  max-http-header-size: 16KB
