# nginx 反向代理示例（TLS 由 nginx 终结）
#
# 关键点：
# 1) WebSocket 需要显式透传 Upgrade/Connection，并放大 proxy_read_timeout，
#    否则一分钟没数据就被断开，客户端要不停重连；
# 2) 必须带 X-Forwarded-Proto，服务端 MIM_FORWARD_HEADERS=framework 才会认；
# 3) 服务端设 MIM_BIND_ADDRESS=127.0.0.1，只让 nginx 能连 8080。
server {
    listen 443 ssl http2;
    server_name mim.example.com;

    ssl_certificate     /etc/letsencrypt/live/mim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mim.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 单个密文附件上限约 15MB，留出余量
    client_max_body_size 24m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# /etc/nginx/conf.d/upgrade.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
