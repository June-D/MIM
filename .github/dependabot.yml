version: 2
updates:
  - package-ecosystem: maven
    directory: /MIMServer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 主版本需要人工迁移（Boot 4 / jjwt 0.13 都有破坏性 API 变更）
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.jsonwebtoken:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mybatis.spring.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.slf4j:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.kordamp.ikonli:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /MIMClient
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
