# ============================================================
# 客户端连接配置
# ============================================================
# 本地开发（HTTP）：
#   feign-client.ribbon.listOfServers = localhost:8080
# 生产（HTTPS）：
#   feign-client.ribbon.listOfServers = mim.example.com:8443
#   feign-client.ribbon.IsSecure = true
#   -Dmim.ws.url=wss://mim.example.com/websocket/test
#
# 注意：改了协议就必须两侧一起改，否则客户端会因混合协议被拒绝。
# ============================================================

feign-client.ribbon.MaxAutoRetries = 1
feign-client.ribbon.MaxAutoRetriesNextServer = 1
feign-client.ribbon.OkToRetryOnAllOperations = false
feign-client.ribbon.ServerListRefreshInterval = 40000
feign-client.ribbon.ConnectTimeout = 10000
feign-client.ribbon.ReadTimeout = 60000
feign-client.ribbon.listOfServers = localhost:8080
feign-client.ribbon.EnablePrimeConnections = true

# 是否走 HTTPS。设为 true 时 listOfServers 应为 域名:8443
feign-client.ribbon.IsSecure = false

# 是否校验服务端证书。生产环境必须保持 true；
# 仅在使用自签证书做本地联调时才临时改为 false。
mim.tls.verifyCertificate = true
