[package]
name = "mim-core-rust"
version = "0.1.0"
edition = "2021"
description = "MiM 协议核心的 Rust spike：用 Java 基准向量逐字节对拍，验证 Android/iOS 复用路线"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", optional = true }

[features]
default = []
jni = ["dep:jni"]
